<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" fill="none">
  <defs>
    <linearGradient id="bg" x1="70" y1="22" x2="1110" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FAFF"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17345F" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L8 5L1 9" stroke="#7191BF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="470" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="45" r="140" fill="#DDEAFF" opacity=".55"/>
  <circle cx="75" cy="425" r="115" fill="#DFEBFF" opacity=".55"/>
  <text x="64" y="75" fill="#60799C" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">ARQUITECTURA · FLUJO DE DATOS</text>
  <text x="64" y="112" fill="#172B4D" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">De la búsqueda al pronóstico</text>

  <g filter="url(#shadow)">
    <rect x="60" y="170" width="235" height="172" rx="20" fill="#FFFFFF"/>
    <rect x="335" y="170" width="235" height="172" rx="20" fill="#FFFFFF"/>
    <rect x="610" y="170" width="235" height="172" rx="20" fill="#FFFFFF"/>
    <rect x="885" y="170" width="255" height="172" rx="20" fill="#FFFFFF"/>
  </g>

  <path d="M300 256H324" stroke="#7191BF" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M575 256H599" stroke="#7191BF" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M850 256H874" stroke="#7191BF" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="91" cy="204" r="16" fill="#E9F1FF"/>
  <text x="91" y="209" text-anchor="middle" fill="#3478E5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1</text>
  <text x="82" y="250" fill="#1E3559" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Interfaz</text>
  <text x="82" y="280" fill="#60799C" font-family="Segoe UI, Arial, sans-serif" font-size="14">El usuario ingresa</text>
  <text x="82" y="302" fill="#60799C" font-family="Segoe UI, Arial, sans-serif" font-size="14">una ciudad y envía</text>
  <text x="82" y="324" fill="#60799C" font-family="Segoe UI, Arial, sans-serif" font-size="14">el formulario.</text>

  <circle cx="366" cy="204" r="16" fill="#E9F1FF"/>
  <text x="366" y="209" text-anchor="middle" fill="#3478E5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2</text>
  <text x="357" y="250" fill="#1E3559" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Controlador</text>
  <text x="357" y="280" fill="#60799C" font-family="Segoe UI, Arial, sans-serif" font-size="14">Coordina búsqueda,</text>
  <text x="357" y="302" fill="#60799C" font-family="Segoe UI, Arial, sans-serif" font-size="14">carga, errores y</text>
  <text x="357" y="324" fill="#60799C" font-family="Segoe UI, Arial, sans-serif" font-size="14">resultado.</text>

  <circle cx="641" cy="204" r="16" fill="#E9F1FF"/>
  <text x="641" y="209" text-anchor="middle" fill="#3478E5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3</text>
  <text x="632" y="250" fill="#1E3559" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Servicios y clientes</text>
  <text x="632" y="280" fill="#60799C" font-family="Segoe UI, Arial, sans-serif" font-size="14">Buscan coordenadas,</text>
  <text x="632" y="302" fill="#60799C" font-family="Segoe UI, Arial, sans-serif" font-size="14">consultan el pronóstico</text>
  <text x="632" y="324" fill="#60799C" font-family="Segoe UI, Arial, sans-serif" font-size="14">y validan las respuestas.</text>

  <circle cx="916" cy="204" r="16" fill="#E9F1FF"/>
  <text x="916" y="209" text-anchor="middle" fill="#3478E5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">4</text>
  <text x="907" y="250" fill="#1E3559" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Open-Meteo</text>
  <text x="907" y="280" fill="#60799C" font-family="Segoe UI, Arial, sans-serif" font-size="14">Geocoding API</text>
  <text x="907" y="302" fill="#60799C" font-family="Segoe UI, Arial, sans-serif" font-size="14">Forecast API</text>
  <rect x="907" y="314" width="118" height="20" rx="10" fill="#EAF2FF"/>
  <text x="966" y="328" text-anchor="middle" fill="#3478E5" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">SIN API KEY</text>

  <text x="64" y="404" fill="#7890B0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Coordenadas → temperatura · humedad relativa · precipitación</text>
</svg>
