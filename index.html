<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Consulta la temperatura, humedad y precipitación actual de cualquier ciudad."
    />
    <meta name="theme-color" content="#f4f7fb" />
    <title>Clima actual | Weather</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="weather-card" aria-labelledby="page-title">
        <p class="eyebrow">PRONÓSTICO LOCAL</p>
        <h1 id="page-title">El clima, <span>al día.</span></h1>
        <p class="intro">Consulta las condiciones actuales en cualquier ciudad.</p>

        <form id="city-search-form" class="search-form" novalidate>
          <label for="city-input">Nombre de la ciudad</label>
          <div class="search-controls">
            <input
              id="city-input"
              name="city"
              type="text"
              maxlength="100"
              placeholder="Ej. Ciudad de México"
              autocomplete="off"
              aria-describedby="search-error"
              required
            />
            <button type="submit">
              <span>Buscar</span>
              <span aria-hidden="true">→</span>
            </button>
          </div>
          <p id="search-error" class="validation-message" role="alert" hidden></p>
        </form>

        <p id="loading-indicator" class="loading-message" role="status" aria-live="polite" hidden>
          <span class="spinner" aria-hidden="true"></span>
          Consultando el clima...
        </p>
        <p id="error-message" class="error-message" role="alert" hidden></p>

        <section
          id="weather-display"
          class="weather-display"
          aria-label="Pronóstico actual"
          aria-live="polite"
          hidden
        ></section>

        <footer>
          <span class="weather-mark" aria-hidden="true">◌</span>
          <span>Datos meteorológicos por Open-Meteo</span>
        </footer>
      </section>
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
